<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Clinical Trial Planner (2026)</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 950px; }
        h2 { color: #1a73e8; border-bottom: 2px solid #eef0f2; padding-bottom: 10px; margin-top: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.85rem; font-weight: 600; color: #5f6368; margin-bottom: 5px; }
        input, select { padding: 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 1rem; }
        button { background: #1a73e8; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #1557b0; }
        .results-panel { margin-top: 30px; display: none; border-top: 2px dashed #e8eaed; padding-top: 20px; }
        canvas { margin-top: 20px; max-height: 400px; }
        .n-badge { font-size: 1.5rem; font-weight: bold; color: #d93025; }
        .mode-toggle { display: flex; margin-bottom: 15px; }
        .mode-toggle button { flex-grow: 1; margin: 0 5px; background: #e8eaed; color: #3c4043; border-radius: 4px; padding: 10px; }
        .mode-toggle button.active { background: #1a73e8; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Advanced Clinical Trial Planner</h2>

    <div class="mode-toggle">
        <button id="mode-sup" class="active" onclick="setMode('superiority')">Superiority Test</button>
        <button id="mode-ni" onclick="setMode('non-inferiority')">Non-Inferiority Test</button>
    </div>
    
    <div class="grid">
        <div class="input-group">
            <label>Endpoint Type</label>
            <select id="type" onchange="toggleInputs()">
                <option value="means">Continuous (Means)</option>
                <option value="props">Proportions (%)</option>
            </select>
        </div>
        <div class="input-group">
            <label id="label1">Mean/Prop. - Control (V₀)</label>
            <input type="number" id="v0" value="10" step="0.1">
        </div>
        <div class="input-group">
            <label id="label2">Mean/Prop. - Treatment (V₁)</label>
            <input type="number" id="v1" value="12" step="0.1">
        </div>
        <div class="input-group" id="sd-container">
            <label>Common Std. Deviation (σ)</label>
            <input type="number" id="sd" value="5" step="0.1">
        </div>
        <div class="input-group">
            <label>Alpha (α)</label>
            <input type="number" id="alpha" value="0.05" step="0.01">
        </div>
        <div class="input-group" id="margin-container" style="display: none;">
            <label>NI Margin (M)</label>
            <input type="number" id="margin" value="1.5" step="0.1">
        </div>
        <div class="input-group">
            <label>Attrition Rate (%)</label>
            <input type="number" id="dropout" value="15" min="0">
        </div>
    </div>

    <button onclick="calculateAndPlot()">Analyze & Visualize Power</button>

    <div id="results" class="results-panel">
        <div style="text-align: center; margin-bottom: 20px;">
            Required Total N (Adjusted for Attrition): <span id="final-n" class="n-badge"></span>
        </div>
        <canvas id="powerChart"></canvas>
    </div>
</div>

<script>
    let chartInstance = null;
    let testMode = 'superiority';

    function getZ(p) {
        const zMap = { 0.025: 1.96, 0.05: 1.645, 0.1: 1.282, 0.2: 0.841, 0.01: 2.326 };
        return zMap[p] || 1.96;
    }

    function toggleInputs() {
        const isMeans = document.getElementById('type').value === 'means';
        document.getElementById('sd-container').style.display = isMeans ? 'flex' : 'none';
        
        if (isMeans) {
            document.getElementById('label1').innerText = "Mean - Control (V₀)";
            document.getElementById('label2').innerText = "Mean - Treatment (V₁)";
            document.getElementById('margin').value = 1.5;
        } else {
            document.getElementById('label1').innerText = "Prop. - Control (%)";
            document.getElementById('label2').innerText = "Prop. - Treatment (%)";
            document.getElementById('margin').value = 0.1;
        }
    }

    function setMode(mode) {
        testMode = mode;
        document.getElementById('mode-sup').classList.remove('active');
        document.getElementById('mode-ni').classList.remove('active');
        document.getElementById(`mode-${mode}`).classList.add('active');
        document.getElementById('margin-container').style.display = (mode === 'non-inferiority') ? 'flex' : 'none';
        // Note: Superiority uses two-sided alpha, NI typically uses one-sided alpha. This script uses simple Z-lookups that are fine for both standard 0.05/0.025 alphas.
    }

    function calculateN(power, type, v0, v1, sd, alpha, margin) {
        const za = getZ(alpha / 2); // For superiority (two-sided)
        const za_ni = getZ(alpha); // For non-inferiority (one-sided)
        const zb = getZ(1 - power);
        let n;
        
        if (type === 'means') {
            const common_var = 2 * Math.pow(sd, 2);
            if (testMode === 'superiority') {
                const diff = Math.abs(v1 - v0);
                n = common_var * Math.pow(za + zb, 2) / Math.pow(diff, 2);
            } else {
                const diff_minus_margin = Math.abs(v1 - v0) - margin;
                n = common_var * Math.pow(za_ni + zb, 2) / Math.pow(diff_minus_margin, 2);
            }
        } else {
            // Proportions logic
            const pAvg = (v0 + v1) / 2;
            const var_term = (testMode === 'superiority') ? 
                (za * Math.sqrt(2 * pAvg * (1 - pAvg)) + zb * Math.sqrt(v0 * (1 - v0) + v1 * (1 - v1))) :
                (za_ni * Math.sqrt(2 * pAvg * (1 - pAvg)) + zb * Math.sqrt(v0 * (1 - v0) + v1 * (1 - v1)));
            
            const denominator = (testMode === 'superiority') ? Math.pow(v1 - v0, 2) : Math.pow(Math.abs(v1 - v0) - margin, 2);
            n = Math.pow(var_term, 2) / denominator;
        }

        if (isNaN(n) || !isFinite(n)) return 0; // Handle edge cases where margin exceeds difference
        return Math.ceil(n) * 2; // Total N for both groups (assuming 1:1)
    }

    function calculateAndPlot() {
        const type = document.getElementById('type').value;
        const v0 = parseFloat(document.getElementById('v0').value);
        const v1 = parseFloat(document.getElementById('v1').value);
        const sd = parseFloat(document.getElementById('sd').value);
        const alpha = parseFloat(document.getElementById('alpha').value);
        const dropout = parseFloat(document.getElementById('dropout').value) / 100;
        const margin = parseFloat(document.getElementById('margin').value);

        // Calculate Target N (for 80% power)
        const targetN = calculateN(0.80, type, v0, v1, sd, alpha, margin);
        const adjustedN = Math.ceil(targetN / (1 - dropout));
        document.getElementById('final-n').innerText = adjustedN;
        document.getElementById('results').style.display = 'block';

        // Prepare chart data (Power vs Sample Size)
        const powers = [0.6, 0.7, 0.8, 0.85, 0.9, 0.95];
        const nValues = powers.map(p => Math.ceil(calculateN(p, type, v0, v1, sd, alpha, margin) / (1 - dropout)));

        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById('powerChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: powers.map(p => (p * 100) + '%'),
                datasets: [{
                    label: `Required Total N (${testMode} test)`,
                    data: nValues,
                    borderColor: '#1a73e8',
                    backgroundColor: 'rgba(26, 115, 232, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 6,
                    pointHoverRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false }, title: { display: true, text: `Power Curve for ${testMode} testing` } },
                scales: {
                    y: { title: { display: true, text: 'Total Participants (Adjusted)' }, min: 0 },
                    x: { title: { display: true, text: 'Target Statistical Power' } }
                }
            }
        });
    }
    
    // Initialize UI state correctly
    toggleInputs();
    setMode('superiority');
</script>

</body>
</html>
